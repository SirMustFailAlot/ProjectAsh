name: CI/CD Build and Release

on:
  # Triggers on any PR to cobblemon-1.7 to verify it builds successfully
  pull_request:
    branches:
      - cobblemon-1.7
  # Triggers when you push a version tag (e.g., v1.0.10) to deploy a Release
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the action can upload files to GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Updated to Java 21 to match your build.gradle exactly!
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # This ONLY runs the build tasks for the Fabric submodule, ignoring Forge
      - name: Build Fabric Mod
        run: ./gradlew :Fabric:build

      # This step ONLY runs if you pushed a tag (e.g., v1.0.10) and the build succeeded
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          # Grabs the compiled Fabric JAR from your Fabric project build directory
          files: |
            Fabric/build/libs/*.jar
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}